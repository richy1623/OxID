[package]
name = "oxid_application"
edition = "2024"
version.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
lettre = { version = "0.11" }
diesel = { version = "2.3.6", features = ["postgres", "uuid", "r2d2"] }
diesel_migrations = "2.3.1"
pq-sys = { version = "0.7.5", features = ["bundled"] }
openssl-sys = { version = "0.9.111", features = ["vendored"] }
dotenvy = "0.15"
serde = "1.0.228"
uuid = { version = "1.20.0", features = ["serde"] }
# TODO Update when v6 of password hash comes out
argon2 = { version = "0.5" }
rand_core = { version = "0.6", features = ["getrandom"] }
password-hash = { version = "0.5", features = ["rand_core"] }
thiserror = "2.0.18"

[dev-dependencies]
rstest = "0.26.1"
