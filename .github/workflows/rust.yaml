name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
    types: [closed]
    branches: [alpha]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Standard Tests
    if: ${{
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci]'))
      ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
          POSTGRES_INITDB_ARGS: "-c max_connections=500"
        ports:
          - 5430:5432
        options: >-
          --health-cmd pg_isready --health-interval 1s --health-timeout 1s --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache/restore@v4
        id: cache-test-restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tarpaulin
        run: |
          if ! cargo tarpaulin --version &> /dev/null; then
            echo "Installing cargo-tarpaulin..."
            cargo install cargo-tarpaulin
          else
            echo "cargo-tarpaulin is already installed."
          fi

      - name: Run tests with coverage
        run: cargo tarpaulin

      - uses: actions/cache/save@v4
        id: cache-test-save
        if: success() || (failure() && steps.cache-test-restore.outputs.cache-hit != 'true')
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura.xml
          fail_ci_if_error: true
